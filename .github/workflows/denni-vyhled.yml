name: Denni vyhled podminek (push notifikace)

on:
  schedule:
    # 6:00 UTC = 7:00 (zima) / 8:00 (leto) stredoevropskeho casu.
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  daily-forecast:
    runs-on: ubuntu-latest
    steps:
      - name: Zavolat daily-forecast Edge Function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -sf -X POST "$SUPABASE_URL/functions/v1/daily-forecast" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
